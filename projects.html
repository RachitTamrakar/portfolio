<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Rachit Tamrakar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="projects-data.js"></script>
    <script src="render-projects.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">Rachit Tamrakar</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="projects.html" class="active">Projects</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="page-header-clean">
            <h1>Projects</h1>
            <p class="page-subtitle-clean">Technical work spanning industrial automation, aerospace propulsion, robotics, and AI</p>
        </section>

        <!-- ALL PROJECTS SECTIONS -->
        <div id="all-projects-container">
            <!-- Projects rendered by render-projects.js -->
        </div>

    </main>

    <footer>
        <p>&copy; 2024 Rachit Tamrakar. All rights reserved.</p>
    </footer>

    <script>
        // Navbar follows scroll
        let lastScroll = 0;
        let navbarOffset = 0;
        const navbar = document.querySelector('.navbar');
        const navbarHeight = navbar.offsetHeight;
        const scrollThreshold = 10;

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll <= scrollThreshold) {
                navbarOffset = 0;
                navbar.style.transform = `translateY(0)`;
                lastScroll = currentScroll;
                return;
            }
            
            const scrollDelta = currentScroll - lastScroll;
            navbarOffset = Math.max(-navbarHeight, Math.min(0, navbarOffset - scrollDelta));
            
            navbar.style.transform = `translateY(${navbarOffset}px)`;
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
