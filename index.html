<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachit Tamrakar - Mechatronics Engineer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="projects-data.js"></script>
    <script src="render-projects.js"></script>
</head>
<body class="home">
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">Rachit Tamrakar</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="projects.html">Projects</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </nav>

    <main>
        <!-- Full-Bleed Hero with responsive background image -->
        <section class="hero-fullbleed" style="background-image:none;">
            <div class="hero-overlay"></div>
            <!-- Responsive hero image (loads eagerly) -->
            <picture aria-hidden="true" class="hero-picture">
                <img class="hero-bg" src="images/mk2_hotfire-w800.png" srcset="images/mk2_hotfire-w1600.png 1600w, images/mk2_hotfire-w1024.png 1024w, images/mk2_hotfire-w800.png 800w" sizes="100vw" alt="Solaris Mk II test fire" loading="eager" onerror="this.style.display='none'">
            </picture>
            <div class="hero-content-center">
                <h1>Rachit Tamrakar</h1>
                <p class="hero-tagline">Mechatronics & Robotics Student &middot; Computer Vision Systems &middot; Aerospace Avionics/Test Engineering</p>
                <div class="hero-ctas">
                    <a href="projects.html" class="btn-primary">View Projects</a>
                    <a href="about.html" class="btn-secondary">About</a>
                    <a href="RachitTamrakarResume.pdf" class="btn-secondary" download>Resume</a>
                </div>
            </div>
        </section>

        <!-- Featured Projects -->
        <div class="featured-projects-section" id="featured-projects-container">
            <!-- Projects rendered by render-projects.js -->
        </div>

    </main>

    <footer>
        <p>&copy; 2024 Rachit Tamrakar. All rights reserved.</p>
    </footer>

    <script>
        // Navbar follows scroll
        let lastScroll = 0;
        let navbarOffset = 0;
        const navbar = document.querySelector('.navbar');
        const navbarHeight = navbar.offsetHeight;
        const scrollThreshold = 10;

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll <= scrollThreshold) {
                navbarOffset = 0;
                navbar.style.transform = `translateY(0)`;
                lastScroll = currentScroll;
                return;
            }
            
            const scrollDelta = currentScroll - lastScroll;
            navbarOffset = Math.max(-navbarHeight, Math.min(0, navbarOffset - scrollDelta));
            
            navbar.style.transform = `translateY(${navbarOffset}px)`;
            lastScroll = currentScroll;
        });
    </script>
    <style>
        /* Small overrides to position responsive hero image to cover the full-bleed section */
        .hero-fullbleed { position: relative; }
        .hero-fullbleed .hero-picture { position: absolute; inset: 0; z-index: 0; }
        .hero-fullbleed .hero-bg { width: 100%; height: 100%; object-fit: cover; display: block; }
        .hero-fullbleed .hero-content-center { position: relative; z-index: 1; }
    </style>
</body>
</html>
